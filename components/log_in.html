<!-- Popup de iniciar sesión -->
<link rel="stylesheet" href="CSS/log_in.css">
<div id="niebla_log_in">
  <div id="div_log_in" role="dialog" aria-modal="true" aria-labelledby="titulo_log_in">
    <button type="button" id="cancelar_log_in" aria-label="Cerrar" onclick="esconderLog_in()">
      <img src="sources/cruz.png" alt="">
    </button>

    <h2 id="titulo_log_in" class="titulo_log_in">Inicia sesión</h2>
    <p class="subtitulo_log_in">Entra en tu cuenta de Exercise Your Goals para guardar tu progreso.</p>

    <form id="formulario" novalidate>
      <div class="campo">
        <label for="Email" id="labelEmail">Email</label>
        <input type="email" id="Email" autocomplete="email" placeholder="tucorreo@ejemplo.com" required>
      </div>

      <div class="campo">
        <label for="Contrasena" id="labelContrasena">Contraseña</label>
        <div class="campo-password">
          <input type="password" id="Contrasena" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="show-password" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M8 14c3.6 0 6.4-3.1 7.6-4.9.5-.7.5-1.6 0-2.3C14.4 5.1 11.6 2 8 2 4.4 2 1.6 5.1.4 6.9c-.5.7-.5 1.6 0 2.2C1.6 10.9 4.4 14 8 14zm0-9c1.7 0 3 1.3 3 3s-1.3 3-3 3-3-1.3-3-3 1.3-3 3-3z" fill="currentColor" fill-rule="nonzero"></path>
              <line class="tachado" x1="2" y1="14" x2="14" y2="2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line>
            </svg>
          </button>
        </div>
      </div>

      <div id="log_in_incorrecto" role="alert"><span>Correo electrónico o contraseña incorrectos</span></div>

      <button type="submit" id="boton_log_in" disabled>Iniciar sesión</button>

      <div class="enlaces_log_in">
        <a href="#" id="contra_olvidada">¿Olvidaste tu contraseña?</a>
        <a href="create_account.html">Crear una cuenta nueva</a>
      </div>
    </form>
  </div>
</div>
